<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Math Mole Web Trap</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .game-container {
            background-color: #ffffff;
            border: 2px solid #333;
            border-radius: 12px;
            padding: 20px;
            width: 320px;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
        }

        .math-question {
            font-size: 32px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .status-bar {
            display: flex;
            justify-content: space-between;
            font-size: 16px;
            margin-bottom: 15px;
            font-weight: bold;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            justify-items: center;
            margin-bottom: 15px;
        }

        .hole {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background-color: #777;
            border: 3px solid #444;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            cursor: pointer;
            user-select: none;
            transition: transform 0.1s;
        }

        .hole:active {
            transform: scale(0.95);
        }

        .hole-number {
            position: absolute;
            bottom: 4px;
            font-size: 12px;
            color: #fff;
            font-weight: bold;
        }

        .web {
            position: absolute;
            font-size: 40px;
            display: none;
            pointer-events: none;
        }

        .web.active {
            display: block;
        }

        .mole {
            position: absolute;
            font-size: 35px;
            display: none;
            pointer-events: none;
        }

        .mole.active {
            display: block;
        }

        .zero-container {
            grid-column: 2;
        }

        .result-message {
            font-size: 20px;
            font-weight: bold;
            height: 30px;
        }

        .correct { color: #4CAF50; }
        .wrong { color: #f44336; }
    </style>
</head>
<body>

<div class="game-container">
    <div class="math-question" id="question">-- + -- = ?</div>
    <div class="status-bar">
        <span id="timer">Time: 5.0s</span>
        <span id="score">Score: 0</span>
    </div>

    <!-- Telephone layout 1-9 -->
    <div class="grid">
        <div class="hole" data-digit="1"><span class="web">🕸️</span><span class="mole">🐹</span><span class="hole-number">1</span></div>
        <div class="hole" data-digit="2"><span class="web">🕸️</span><span class="mole">🐹</span><span class="hole-number">2</span></div>
        <div class="hole" data-digit="3"><span class="web">🕸️</span><span class="mole">🐹</span><span class="hole-number">3</span></div>
        <div class="hole" data-digit="4"><span class="web">🕸️</span><span class="mole">🐹</span><span class="hole-number">4</span></div>
        <div class="hole" data-digit="5"><span class="web">🕸️</span><span class="mole">🐹</span><span class="hole-number">5</span></div>
        <div class="hole" data-digit="6"><span class="web">🕸️</span><span class="mole">🐹</span><span class="hole-number">6</span></div>
        <div class="hole" data-digit="7"><span class="web">🕸️</span><span class="mole">🐹</span><span class="hole-number">7</span></div>
        <div class="hole" data-digit="8"><span class="web">🕸️</span><span class="mole">🐹</span><span class="hole-number">8</span></div>
        <div class="hole" data-digit="9"><span class="web">🕸️</span><span class="mole">🐹</span><span class="hole-number">9</span></div>
        <div></div> <!-- Empty left slot -->
        <div class="hole" data-digit="0"><span class="web">🕸️</span><span class="mole">🐹</span><span class="hole-number">0</span></div>
        <div></div> <!-- Empty right slot -->
    </div>

    <div class="result-message" id="result"></div>
</div>

<script>
    let score = 0;
    let timeLeft = 5.0;
    let timerInterval = null;
    let currentAnswer = 0;
    let correctDigits = [];
    let selectedDigits = [];
    let isRoundActive = false;

    const questionEl = document.getElementById('question');
    const timerEl = document.getElementById('timer');
    const scoreEl = document.getElementById('score');
    const resultEl = document.getElementById('result');
    const holes = document.querySelectorAll('.hole');

    holes.forEach(hole => {
        hole.addEventListener('click', () => {
            if (!isRoundActive) return;
            const digit = parseInt(hole.getAttribute('data-digit'));
            
            // Toggle web trap
            if (!selectedDigits.includes(digit) && selectedDigits.length < 2) {
                selectedDigits.push(digit);
                hole.querySelector('.web').classList.add('active');
            }

            // Auto-check if 2 traps placed
            if (selectedDigits.length === 2) {
                endRound();
            }
        });
    });

    function generateQuestion() {
        const ops = ['+', '-', '*', '/'];
        while (true) {
            const op = ops[Math.floor(Math.random() * ops.length)];
            let a, b, ans;

            if (op === '+') {
                a = Math.floor(Math.random() * 80) + 5;
                b = Math.floor(Math.random() * 80) + 5;
                ans = a + b;
            } else if (op === '-') {
                a = Math.floor(Math.random() * 80) + 20;
                b = Math.floor(Math.random() * (a - 10)) + 5;
                ans = a - b;
            } else if (op === '*') {
                a = Math.floor(Math.random() * 20) + 2;
                b = Math.floor(Math.random() * 40) + 2;
                ans = a * b;
            } else if (op === '/') {
                b = Math.floor(Math.random() * 10) + 2;
                ans = Math.floor(Math.random() * 90) + 10;
                a = ans * b;
            }

            // Must be 2-digit (10-99) and NO double numbers (e.g., 55)
            if (ans >= 10 && ans <= 99) {
                const tens = Math.floor(ans / 10);
                const ones = ans % 10;
                if (tens !== ones) {
                    const symbol = op === '*' ? '×' : op === '/' ? '÷' : op;
                    questionEl.textContent = `${a} ${symbol} ${b} = ?`;
                    return { ans, digits: [tens, ones] };
                }
            }
        }
    }

    function startRound() {
        // Reset state
        selectedDigits = [];
        timeLeft = 5.0;
        isRoundActive = true;
        resultEl.textContent = '';
        resultEl.className = 'result-message';

        holes.forEach(hole => {
            hole.querySelector('.web').classList.remove('active');
            hole.querySelector('.mole').classList.remove('active');
        });

        // Setup math
        const qData = generateQuestion();
        currentAnswer = qData.ans;
        correctDigits = qData.digits;

        // Start timer
        clearInterval(timerInterval);
        timerEl.textContent = `Time: 5.0s`;
        timerInterval = setInterval(() => {
            timeLeft -= 0.1;
            if (timeLeft <= 0) {
                timeLeft = 0;
                endRound();
            }
            timerEl.textContent = `Time: ${timeLeft.toFixed(1)}s`;
        }, 100);
    }

    function endRound() {
        if (!isRoundActive) return;
        isRoundActive = false;
        clearInterval(timerInterval);

        // Show moles at correct positions
        correctDigits.forEach(digit => {
            const hole = document.querySelector(`.hole[data-digit="${digit}"]`);
            if (hole) hole.querySelector('.mole').classList.add('active');
        });

        // Check victory
        const isWin = selectedDigits.length === 2 && 
                      correctDigits.includes(selectedDigits[0]) && 
                      correctDigits.includes(selectedDigits[1]);

        if (isWin) {
            score += 10;
            scoreEl.textContent = `Score: ${score}`;
            resultEl.textContent = `✅ Trapped! Ans: ${currentAnswer}`;
            resultEl.classList.add('correct');
        } else {
            resultEl.textContent = `❌ Escaped! Ans: ${currentAnswer}`;
            resultEl.classList.add('wrong');
        }

        // Wait 2 seconds and start next round
        setTimeout(startRound, 2000);
    }

    // Start initial game
    startRound();
</script>

</body>
</html>
